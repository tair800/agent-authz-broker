[project]
name = "agent-authz-broker"
version = "0.1.0"
description = "An MCP resource server that refuses tokens minted for anyone else, attenuates delegated scope, and will not run an irreversible tool without a recorded human approval."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_authz_broker"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_authz_broker/py.typed" = "agent_authz_broker/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# N802: the kill tests are named test_A_/test_B_ after the scenarios ADR-001 lettered. Renaming
# them to satisfy a naming rule would break the link between the test and the record that fixed it.
"tests/*" = ["ANN201", "ANN001", "S101", "S105", "S106", "N802"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q"
markers = [
    "integration: needs real PostgreSQL",
    "mcp: drives the MCP server over its transport",
]
